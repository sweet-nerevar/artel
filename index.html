<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>лорбучек</title>

  <style>

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; }

    body {

      font-family: Georgia, "Times New Roman", serif;

      background: transparent;

      overflow: hidden;

    }



    button { font: inherit; }



    .library {

      position: relative;

      width: 100%;

      height: 100%;

      display: grid;

      place-items: center;

      overflow: hidden;

      padding: 24px;

    }

    .book-trigger,
.book-close {
  background: transparent !important;
  border: none !important;
  outline: none !important;
  box-shadow: none !important;
  appearance: none;
  -webkit-appearance: none;
  padding: 0;
  margin: 0;
}

.book-trigger img,
.book-close img {
  display: block;
  background: transparent;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));
}


    /* закрытая книга */



    .book-trigger {

      position: absolute;

      left: 10%;

      top: 10%;

      width: 32%;

      border: 0;

      background: transparent;

      padding: 0;

      cursor: pointer;

      transform: rotate(-8deg);

      transition: transform .28s ease, filter .28s ease;

      filter: drop-shadow(0 10px 14px rgba(0,0,0,.35));

    }



    .book-trigger:hover,

    .book-trigger:focus-visible {

      transform: rotate(-10deg) translateY(-4px) scale(1.03);

      filter: drop-shadow(0 15px 18px rgba(0,0,0,.42));

      outline: none;

    }



    .book-trigger img {

      display: block;

      width: 100%;

      height: auto;

      pointer-events: none;

    }



    /* оверлей */

    .opened {

      position: fixed;

      inset: 0;

      display: none;

      z-index: 20;

    }



    .opened.active {

      display: block;

    }



    .backdrop {

      position: absolute;

      inset: 0;

      background: rgba(11, 12, 16, .78);

      backdrop-filter: blur(4px);

    }



    .viewer {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 18px 18px 58px;

    }

    .close-button {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 25;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: rgba(230, 208, 173, .68);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 300;
      line-height: 1;
      transition: color .18s ease, background .18s ease, transform .18s ease;
    }
    .close-button:hover,
    .close-button:focus-visible {
      color: #f2d8a5;
      background: rgba(80, 54, 32, .22);
      transform: rotate(90deg);
      outline: none;
    }
    .close-button:focus-visible { box-shadow: 0 0 0 2px rgba(203, 161, 99, .45); }

    .book-wrap {

      position: relative;

      width: min(100%, 1200px);

      height: min(100%, 850px);

    }



    .canvas {

      position: absolute;

      inset: 12px 0 50px;

      overflow: hidden;

    }



    .book {

      --scale: 1;

      --shift: -216px;

      position: absolute;

      width: 864px;

      height: 612px;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%) scale(var(--scale)) translateX(var(--shift));

      transition: transform 720ms cubic-bezier(.22,.67,.2,1);

      perspective: 2200px;

      transform-style: preserve-3d;

      cursor: pointer;

      user-select: none;

      -webkit-user-select: none;

    }



    .paper {

      position: absolute;

      top: 0;

      bottom: 0;

      width: 50%;

      overflow: hidden;

      box-shadow: 0 10px 26px rgba(0,0,0,.22), 0 2px 5px rgba(0,0,0,.12);

  

    }



    .paper.left { left: 0; border-radius: 4px 0 0 4px; }

    .paper.right { right: 0; border-radius: 0 4px 4px 0; }

    .book.front-closed .paper.left,

    .book.back-closed .paper.right { visibility: hidden; }



    .spine {

      z-index: 4;

      position: absolute;

      left: calc(50% - 13px);

      top: 0;

      width: 26px;

      height: 100%;

      pointer-events: none;

      background: linear-gradient(90deg,

        rgba(255,255,255,.1) 0%,

        rgba(0,0,0,.08) 20%,

        rgba(0,0,0,.25) 48%,

        rgba(255,255,255,.18) 54%,

        rgba(0,0,0,.08) 100%);

      opacity: .92;

      transition: opacity .15s;

    }



    .book.front-closed .spine,

    .book.back-closed .spine { opacity: 0; }



    .leaf {

      position: absolute;

      top: 0;

      left: 0;

      width: 50%;

      height: 100%;

      transform-style: preserve-3d;

      z-index: 15;

      pointer-events: none;

      transition: transform 720ms cubic-bezier(.34,.12,.28,1);

    }



    .leaf.forward { left: 50%; transform-origin: left center; transform: rotateY(0deg); }

    .leaf.forward.turned { transform: rotateY(-180deg); }

    .leaf.backward { left: 0; transform-origin: right center; transform: rotateY(0deg); }

    .leaf.backward.turned { transform: rotateY(180deg); }



    .leaf-face {

      position: absolute;

      inset: 0;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      overflow: hidden;

      background: #f0eee8;

      box-shadow: 0 6px 18px rgba(0,0,0,.19);

    }



    .leaf-face.back { transform: rotateY(180deg); }

    .leaf-face::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.02) 100%);

    }

    .leaf.forward .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 28%, rgba(0,0,0,.08)); }

    .leaf.forward .leaf-face.back::after { background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 30%); }

    .leaf.backward .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 35%, rgba(0,0,0,.06)); }

    .leaf.backward .leaf-face.back::after { background: linear-gradient(90deg, rgba(0,0,0,.09), transparent 35%); }



    .face-body {

      position: relative;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #ece9e0;

    }



    .image-page {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: fill;

      user-select: none;

      -webkit-user-drag: none;

    }

    .toolbar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      width: max-content;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .toolbar button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      min-width: 0;
      padding: 0 0 2px;
      border: 1px solid rgba(172, 127, 69, .74);
      border-radius: 50%;
      background: rgba(36, 27, 22, .32);
      box-shadow: inset 0 0 0 1px rgba(229, 190, 126, .18),
                  0 3px 9px rgba(0, 0, 0, .19);
      color: #dcc29c;
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      transition: color .18s ease, border-color .18s ease,
                  background .18s ease, transform .18s ease;
    }
    .toolbar button:hover:not(:disabled),
    .toolbar button:focus-visible:not(:disabled) {
      color: #f5dbb3;
      border-color: rgba(222, 180, 112, .95);
      background: rgba(73, 46, 28, .65);
      transform: translateY(-2px);
      outline: none;
    }
    .toolbar button:focus-visible { box-shadow: 0 0 0 2px rgba(210, 168, 102, .5); }
    .toolbar button:disabled {
      opacity: .23;
      cursor: default;
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }




    @media (max-width: 860px) {

      .viewer { padding-inline: 10px; }

      .hint { display: none; }

    }



    @media (max-width: 560px) {
      .toolbar { gap: 24px; bottom: 6px; }
      .toolbar button { width: 34px; height: 34px; font-size: 18px; }
      .close-button { top: 5px; right: 5px; }
      .tap-hint { bottom: -50px; white-space: normal; width: 180px; }
    }



    @media (prefers-reduced-motion: reduce) {

      .book, .leaf, .book-trigger, .opened { transition-duration: 0.1ms !important; }

    }

  </style>

</head>

<body>

  <main class="library" id="library">

    <div class="shelf-stage" aria-label="Полка с книжечкой Мэгги">

      <button class="book-trigger" id="openBook" type="button" aria-label="artel lorebook">

        <img src="./wholebook.webp" alt="book of artel" draggable="false">

      </button>

    </div>



    <section class="opened" id="opened" aria-hidden="true">

      <div class="backdrop" id="backdrop"></div>

      <button class="close-button" id="closeBook" type="button" aria-label="Закрыть книгу" title="Закрыть">×</button>

      <div class="viewer">

        <div class="book-wrap">



          <div class="canvas" id="canvas">

            <div class="book front-closed" id="book" role="group" aria-label="Artel lorebook">

              <div class="paper left" id="leftPaper"></div>

              <div class="paper right" id="rightPaper"></div>

              <div class="spine"></div>

            </div>

          </div>

          <nav class="toolbar" aria-label="Навигация по книге">

            <button id="prev" type="button" aria-label="Предыдущая страница" title="Назад">←</button>

            <span class="status" id="status" aria-live="polite"></span>

            <button id="next" type="button" aria-label="Следующая страница" title="Вперед">→</button>

          </nav>

        </div>

      </div>

    </section>

  </main>



  <script>

    "use strict";



    const ASSETS = {

      cover: "./inthebeniningen.webp",

      back: "./intheinbthebenin.webp",

      pages: [

        "./bea.webp",

        "./bea_text.webp",

        "./owen.webp",

        "./owen_text.webp",

        "./elias.webp",

        "./elias_text.webp",

        "./maggie.webp",

        "./maggie_text.webp"

      ]

    };



    const PAGE_WIDTH = 432;

    const BOOK_WIDTH = PAGE_WIDTH * 2;

    const BOOK_HEIGHT = 612;

    const DURATION_MS = 720;

    const LAST_SPREAD = 3;



    const openBookButton = document.getElementById("openBook");

    const closeBookButton = document.getElementById("closeBook");

    const opened = document.getElementById("opened");

    const backdrop = document.getElementById("backdrop");

    const canvas = document.getElementById("canvas");

    const book = document.getElementById("book");

    const leftPaper = document.getElementById("leftPaper");

    const rightPaper = document.getElementById("rightPaper");

    const prevButton = document.getElementById("prev");

    const nextButton = document.getElementById("next");

    const status = document.getElementById("status");



    let position = -1; // -1 = передняя обложка, 0..3 = развороты, 4 = задняя обложка

    let busy = false;

    let scale = 1;

    let animationTimer = null;

    let touchStart = null;



    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      }[ch]));
    }



    function getImage(ref) {

      if (ref === "cover") return ASSETS.cover;

      if (ref === "back") return ASSETS.back;

      if (typeof ref === "number") return ASSETS.pages[ref - 1] || "";

      return "";

    }



    function faceHtml(ref) {

      const imageUrl = getImage(ref);

      const alt = ref === "cover"

        ? "Передняя обложка"

        : ref === "back"

          ? "Задняя обложка"

          : ref === "empty"

            ? ""

            : `Страница ${ref}`;



      if (ref === "empty") {

        return `<div class="face-body"></div>`;

      }



      return `<div class="face-body"><img class="image-page" src="${escapeHtml(imageUrl)}" draggable="false" alt="${escapeHtml(alt)}"></div>`;

    }



    function setPositionShift(pos) {

      const shift = pos === -1 ? -PAGE_WIDTH / 2 : pos === 4 ? PAGE_WIDTH / 2 : 0;

      book.style.setProperty("--shift", shift + "px");

    }



    function renderStatic(pos) {

      book.classList.toggle("front-closed", pos === -1);

      book.classList.toggle("back-closed", pos === 4);



      if (pos === -1) {

        leftPaper.innerHTML = faceHtml("empty");

        rightPaper.innerHTML = faceHtml("cover");

      } else if (pos === 4) {

        leftPaper.innerHTML = faceHtml("back");

        rightPaper.innerHTML = faceHtml("empty");

      } else {

        leftPaper.innerHTML = faceHtml(2 * pos + 1);

        rightPaper.innerHTML = faceHtml(2 * pos + 2);

      }



      setPositionShift(pos);

      status.textContent = pos === -1

        ? "Передняя обложка"

        : pos === 4

          ? "Задняя обложка"

          : `Разворот ${pos + 1} / 4`;



      prevButton.disabled = busy || pos === -1;

      nextButton.disabled = busy || pos === 4;

    }



    function fitBook() {

      scale = Math.min(

        (canvas.clientWidth - 24) / BOOK_WIDTH,

        (canvas.clientHeight - 18) / BOOK_HEIGHT,

        1.45

      );

      book.style.setProperty("--scale", Math.max(.08, scale).toFixed(5));

    }



    function createLeaf(direction, front, back) {

      const leaf = document.createElement("div");

      leaf.className = `leaf ${direction}`;

      leaf.innerHTML = `

        <div class="leaf-face front">${faceHtml(front)}</div>

        <div class="leaf-face back">${faceHtml(back)}</div>`;

      return leaf;

    }



    function go(delta) {

      if (busy) return;

      const target = position + delta;

      if (target < -1 || target > 4) return;



      busy = true;

      const from = position;

      prevButton.disabled = true;

      nextButton.disabled = true;

      book.classList.remove("front-closed", "back-closed");



      let leaf;

      if (delta === 1) {

        if (from === -1) {

          leftPaper.innerHTML = faceHtml("empty");

          rightPaper.innerHTML = faceHtml(2);

          leaf = createLeaf("forward", "cover", 1);

        } else if (from === LAST_SPREAD) {

          leftPaper.innerHTML = faceHtml(7);

          rightPaper.innerHTML = faceHtml("empty");

          leaf = createLeaf("forward", 8, "back");

        } else {

          leftPaper.innerHTML = faceHtml(2 * from + 1);

          rightPaper.innerHTML = faceHtml(2 * target + 2);

          leaf = createLeaf("forward", 2 * from + 2, 2 * target + 1);

        }

      } else {

        if (from === 4) {

          leftPaper.innerHTML = faceHtml(7);

          rightPaper.innerHTML = faceHtml("empty");

          leaf = createLeaf("backward", "back", 8);

        } else if (from === 0) {

          leftPaper.innerHTML = faceHtml("empty");

          rightPaper.innerHTML = faceHtml(2);

          leaf = createLeaf("backward", 1, "cover");

        } else {

          leftPaper.innerHTML = faceHtml(2 * target + 1);

          rightPaper.innerHTML = faceHtml(2 * from + 2);

          leaf = createLeaf("backward", 2 * from + 1, 2 * target + 2);

        }

      }



      book.appendChild(leaf);

      requestAnimationFrame(() => requestAnimationFrame(() => {

        setPositionShift(target);

        leaf.classList.add("turned");

      }));



      clearTimeout(animationTimer);

      animationTimer = setTimeout(() => {

        position = target;

        leaf.remove();

        busy = false;

        renderStatic(position);

      }, DURATION_MS + 70);

    }



    function openViewer() {

      opened.classList.add("active");

      opened.setAttribute("aria-hidden", "false");

      fitBook();

      renderStatic(position);

      setTimeout(() => closeBookButton.focus(), 30);

    }



    function closeViewer() {

      opened.classList.remove("active");

      opened.setAttribute("aria-hidden", "true");

      busy = false;

      clearTimeout(animationTimer);

      position = -1;

      Array.from(book.querySelectorAll('.leaf')).forEach(node => node.remove());

      renderStatic(position);

      openBookButton.focus();

    }



    openBookButton.addEventListener("click", openViewer);

    closeBookButton.addEventListener("click", closeViewer);

    backdrop.addEventListener("click", closeViewer);

    prevButton.addEventListener("click", () => go(-1));

    nextButton.addEventListener("click", () => go(1));



    book.addEventListener("click", event => {

      if (busy) return;

      if (position === -1) { go(1); return; }

      if (position === 4) { go(-1); return; }

      const rect = book.getBoundingClientRect();

      go(event.clientX < rect.left + rect.width / 2 ? -1 : 1);

    });



    document.addEventListener("keydown", event => {

      const isOpen = opened.classList.contains("active");

      if (!isOpen) return;

      if (event.key === "Escape") {

        event.preventDefault();

        closeViewer();

      }

      if (event.key === "ArrowRight") {

        event.preventDefault();

        go(1);

      }

      if (event.key === "ArrowLeft") {

        event.preventDefault();

        go(-1);

      }

    });



    canvas.addEventListener("touchstart", e => {

      if (e.touches.length === 1) {

        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };

      }

    }, { passive: true });



    canvas.addEventListener("touchend", e => {

      if (!touchStart || !e.changedTouches.length) return;

      const dx = e.changedTouches[0].clientX - touchStart.x;

      const dy = e.changedTouches[0].clientY - touchStart.y;

      touchStart = null;

      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {

        e.preventDefault();

        go(dx < 0 ? 1 : -1);

      }

    }, { passive: false });



    window.addEventListener("resize", fitBook);

    if ("ResizeObserver" in window) {

      new ResizeObserver(fitBook).observe(canvas);

    }



    fitBook();

    renderStatic(position);

  </script>

</body>

</html>
