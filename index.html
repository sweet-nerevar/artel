<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>лорбучек</title>

  <style>

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; }

    body {

      font-family: Georgia, "Times New Roman", serif;

      background: transparent;

      overflow: hidden;

    }

    button { font: inherit; }

    .library {

      position: relative;

      width: 100%;

      height: 100%;

      display: grid;

      place-items: center;

      overflow: hidden;

      padding: 24px;

    }

    .book-trigger,

.book-close {

  background: transparent !important;

  border: none !important;

  outline: none !important;

  box-shadow: none !important;

  appearance: none;

  -webkit-appearance: none;

  padding: 0;

  margin: 0;

}

.book-trigger img,

.book-close img {

  display: block;

  background: transparent;

  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.18));

}

    /* закрытая книга */

    .book-trigger {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140px;
      transform: translate(-50%, -50%);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform .28s ease, filter .28s ease;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.35));
    }

    .book-trigger:hover,
    .book-trigger:focus-visible {
      transform: translate(-50%, -50%) translateY(-3px) scale(1.04);
      filter: drop-shadow(0 15px 18px rgba(0,0,0,.42));
      outline: none;
    }

    .book-trigger img {

      display: block;

      width: 100%;

      height: auto;

      pointer-events: none;

    }

    /* оверлей */

    .opened {

      position: fixed;

      inset: 0;

      display: none;

      z-index: 20;

    }

    .opened.active {

      display: block;

    }

    .backdrop {

      position: absolute;

      inset: 0;

      background: transparent;

      backdrop-filter: none;

    }

    .viewer {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 18px 18px 58px;

    }
    
    /* FULLSCREEN: весь монитор вместо рамки на холсте. */
    .opened:fullscreen,
    .opened:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      background: #130e12;
    }

    .opened.fullscreen-mode .backdrop {
      background: radial-gradient(ellipse at center,
        rgba(45, 31, 31, .22) 0%, rgba(10, 8, 11, .94) 90%);
    }

    .opened.fullscreen-mode .viewer {
      padding: 12px 18px 64px;
    }

    .opened.fullscreen-mode .book-wrap {
      width: min(100%, 1900px);
      height: min(100%, 1200px);
      animation: lorebook-jump .42s cubic-bezier(.18, .8, .21, 1) both;
    }

    .opened.fullscreen-mode .canvas { inset: 4px 0 56px; }

    @keyframes lorebook-jump {
      0%   { opacity: .15; transform: scale(.83); filter: blur(9px); }
      65%  { opacity: 1; transform: scale(1.025); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .opened.fullscreen-mode .book-wrap { animation: none; }
    }

    .close-button {
      position: absolute;
      top: 14px;
      right: 16px;
      z-index: 25;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(199, 154, 93, .8);
      border-radius: 50%;
      background: rgba(37, 27, 24, .90);
      color: #f7e5c7;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 23px;
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .65);
      box-shadow: 0 3px 12px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 221, 158, .1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: color .18s ease, background .18s ease,
                  border-color .18s ease, transform .18s ease;
    }
    .close-button:hover {
      color: #fff2d8;
      background: rgba(78, 48, 30, .96);
      border-color: #e6c28c;
      transform: rotate(90deg) scale(1.06);
    }
    .close-button:focus-visible {
      color: #fff2d8;
      background: rgba(78, 48, 30, .96);
      outline: 2px solid #f4cf95;
      outline-offset: 3px;
    }

    .book-wrap {

      position: relative;

      width: min(100%, 1200px);

      height: min(100%, 850px);

    }

    .canvas {

      position: absolute;

      inset: 12px 0 50px;

      overflow: hidden;

    }

    .book {

      --scale: 1;

      --shift: -216px;

      position: absolute;

      width: 864px;

      height: 612px;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%) scale(var(--scale)) translateX(var(--shift));

      transition: transform 720ms cubic-bezier(.22,.67,.2,1);

      perspective: 2200px;

      transform-style: preserve-3d;

      cursor: pointer;

      user-select: none;

      -webkit-user-select: none;

    }

    .paper {

      position: absolute;

      top: 0;

      bottom: 0;

      width: 50%;

      overflow: hidden;

      box-shadow: 0 10px 26px rgba(0,0,0,.22), 0 2px 5px rgba(0,0,0,.12);

    }

    .paper.left { left: 0; border-radius: 4px 0 0 4px; }

    .paper.right { right: 0; border-radius: 0 4px 4px 0; }

    .book.front-closed .paper.left,

    .book.back-closed .paper.right { visibility: hidden; }

    .spine {

      z-index: 4;

      position: absolute;

      left: calc(50% - 13px);

      top: 0;

      width: 26px;

      height: 100%;

      pointer-events: none;

      background: linear-gradient(90deg,

        rgba(255,255,255,.1) 0%,

        rgba(0,0,0,.08) 20%,

        rgba(0,0,0,.25) 48%,

        rgba(255,255,255,.18) 54%,

        rgba(0,0,0,.08) 100%);

      opacity: .92;

      transition: opacity .15s;

    }

    .book.front-closed .spine,

    .book.back-closed .spine { opacity: 0; }

    .leaf {

      position: absolute;

      top: 0;

      left: 0;

      width: 50%;

      height: 100%;

      transform-style: preserve-3d;

      z-index: 15;

      pointer-events: none;

      transition: transform 720ms cubic-bezier(.34,.12,.28,1);

    }

    .leaf.forward { left: 50%; transform-origin: left center; transform: rotateY(0deg); }

    .leaf.forward.turned { transform: rotateY(-180deg); }

    .leaf.backward { left: 0; transform-origin: right center; transform: rotateY(0deg); }

    .leaf.backward.turned { transform: rotateY(180deg); }

    .leaf-face {

      position: absolute;

      inset: 0;

      backface-visibility: hidden;

      -webkit-backface-visibility: hidden;

      overflow: hidden;

      background: transparent;

      box-shadow: 0 6px 18px rgba(0,0,0,.19);

    }

    .paper.is-cutout,
    .leaf-face.is-cutout {
      background: transparent;
      box-shadow: none;
    }
    .leaf-face.is-cutout::after { display: none; }

    .leaf-face.back { transform: rotateY(180deg); }

    .leaf-face::after {

      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.02) 100%);

    }

    .leaf.forward .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 28%, rgba(0,0,0,.08)); }

    .leaf.forward .leaf-face.back::after { background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 30%); }

    .leaf.backward .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 35%, rgba(0,0,0,.06)); }

    .leaf.backward .leaf-face.back::after { background: linear-gradient(90deg, rgba(0,0,0,.09), transparent 35%); }

    .face-body {

      position: relative;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: transparent;

    }

    .image-page {

      display: block;

      width: 100%;

      height: 100%;

      object-fit: fill;

      user-select: none;

      -webkit-user-drag: none;

    }

    .text-page {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ede1cc url('./background.webp') center center / 100% 100% no-repeat;
      color: #35291f;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 1.43;
      letter-spacing: .005em;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
    }

    .text-page.right { padding: 36px 32px 30px 43px; }
    .text-page.left  { padding: 36px 43px 30px 32px; }

    .text-page-inner {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(105, 79, 49, .35) transparent;
    }
    .text-page-inner::-webkit-scrollbar { width: 4px; }
    .text-page-inner::-webkit-scrollbar-thumb {
      background: rgba(105, 79, 49, .3);
      border-radius: 3px;
    }
    .text-page h2 {
      margin: 0 0 19px;
      font-size: 1.65em;
      font-weight: 700;
      line-height: 1.13;
      letter-spacing: -.018em;
    }
    .text-page p { margin: 0 0 13px; }
    .text-page p:last-child { margin-bottom: 0; }
    .text-page em { font-style: italic; }
    .text-page strong { font-weight: 700; }


    .toolbar {

      position: absolute;

      bottom: 8px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 5;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 38px;

      width: max-content;

      padding: 0;

      border: 0;

      border-radius: 0;

      background: transparent;

      box-shadow: none;

    }

    .toolbar button {

      display: grid;

      place-items: center;

      width: 38px;

      height: 38px;

      min-width: 0;

      padding: 0 0 2px;

      border: 1px solid rgba(172, 127, 69, .74);

      border-radius: 50%;

      background: rgba(36, 27, 22, .32);

      box-shadow: inset 0 0 0 1px rgba(229, 190, 126, .18),

                  0 3px 9px rgba(0, 0, 0, .19);

      color: #dcc29c;

      font-family: Georgia, serif;

      font-size: 20px;

      line-height: 1;

      cursor: pointer;

      transition: color .18s ease, border-color .18s ease,

      background .18s ease, transform .18s ease;

    }

    .toolbar button:hover:not(:disabled),

    .toolbar button:focus-visible:not(:disabled) {

      color: #f5dbb3;

      border-color: rgba(222, 180, 112, .95);

      background: rgba(73, 46, 28, .65);

      transform: translateY(-2px);

      outline: none;

    }

    .toolbar button:focus-visible { box-shadow: 0 0 0 2px rgba(210, 168, 102, .5); }

    .toolbar button:disabled {

      opacity: .23;

      cursor: default;

    }

    .status {

      position: absolute;

      width: 1px;

      height: 1px;

      padding: 0;

      margin: -1px;

      overflow: hidden;

      clip-path: inset(50%);

      white-space: nowrap;

      border: 0;

    }

    @media (max-width: 860px) {

      .viewer { padding-inline: 10px; }

      .hint { display: none; }

    }

    @media (max-width: 560px) {

      .toolbar { gap: 24px; bottom: 6px; }

      .toolbar button { width: 34px; height: 34px; font-size: 18px; }

      .close-button { top: 5px; right: 5px; }

      .tap-hint { bottom: -50px; white-space: normal; width: 180px; }

    }

    @media (prefers-reduced-motion: reduce) {

      .book, .leaf, .book-trigger, .opened { transition-duration: 0.1ms !important; }

    }

  </style>

</head>

<body>

    const TEXT_PAGES = {
      2: `
        <h2>О языках злых и добрых</h2>

        <p>В день, когда она впервые переступает порог класса зельеварения, никто еще не знает ее имени. Вообще-то ее зовут Беа Харпер — мама учила ее произносить имя именно так, хотя сама всегда называла дочь Беатрис.</p>

        <p>В чемодане, едва ли не выше ее самой, остались фотография отца времен Мировой войны, письмо от мамы, несколько совестливо добытых (украденных) формул из домашней аптечной тетради и баночка аспирина, который здорово спасал от мигрени.</p>

        <p>Позже, к своему удивлению, Беа обнаружит, что аспирином здесь почти никто не пользуется. В копилку удивительных открытий вскоре добавится и отношение к «полукровкам». Это слово она услышит впервые от какого-то слизеринца. Тот выплюнет его с таким презрением, будто ей должно стать стыдно, но Беа не вполне поймет за что именно.</p>

        <p>В Хогвартсе все говорят на одном языке, и поначалу это дается ей с трудом. Английский она знает, конечно, но стоит кому-нибудь заговорить слишком быстро, как половина слов превращается в неразборчивую кашу. Беа называет учеников в зеленых галстуках “наттерами” (от die natter), поэтому староста долго не может понять, на каких таких обидчиков (или существ?) она жалуется. Позже домашний язык станет ее личным шифром: на нем удобно ругаться, записывать секреты и думать о вещах, которые предназначаются только ей.
</p>

      <p>Некоторые из ее товарищей-пуффендуйцев вскоре узнают, что Беа знает два мира, и потому изо всех сил стараются с ней подружиться. Они обедают вместе в огромной столовой, которая кажется ей зиккуратом, возведенным во имя уюта и сытости. Показывают друг другу фотографии, старые журналы и вырезки из магловских газет: рекламные картинки автомобилей, афиши немого кино, объявления о продаже граммофонов и пластинок с джазом.</p>

      <p>Так Беа узнает, что мир, который она знает так хорошо, для некоторых учеников все равно что разумная жизнь с другой планеты.</p>

      <p>В свою очередь, Беа изо всех сил старается научиться говорить на их языке. Латынь не такая трудная и очень красивая, но чудаковатые названия заклинаний и зелий запоминаются не сразу. Она выучивает длиннющие имена и фамилии важных личностей, учится отличать бубонтубер от мимбулуса мимблетонии, а заодно выясняет, что некоторые растения могут укусить, если обращаться с ними без должного почтения. Дома такого не случалось. По крайней мере, не с растениями.</p>

      <p>Беа надеется, что благодаря усердному труду и настойчивости однажды докажет свое право переступить порог исследовательской сравнительной фармакологии. Ведь этот мир, наверное, станет болеть чуть меньше, если познакомить его с аспирином.</p>

      <p>Но пока Беа в девятнадцатый раз переступает порог класса зельеварения и просит у преподавателя котел, чтобы приготовить уменьшающее зелье.</p>

      <p>Преподаватель смотрит на нее так, будто она предложила сварить обед из собственного учебника. Затем объясняет, что уменьшающее зелье проходят только на третьем курсе и что мисс Харпер, кажется, несколько забегает вперед программы.</p>

      <p>Беа не понимает, что именно в ее просьбе настолько удивительно. И все же в мыслях мелькает — мама будет ей гордиться.</p>
      `,

        4: `
    <h2>О ритмах и акцентах</h2>

    <p>Раз в месяц в Кинбридж приезжает торговая ярмарка, и Оуэн обожает бывать там по одной очень важной причине. Седой дедушка с добрым взглядом перекладывает по задним полкам квадратные конверты. Слишком большие, чтобы сойти за письма или открытки. И слишком тонкие, чтобы походить на чайные наборы или вроде того.
</p>
    
    <p>Так Оуэн узнает о граммофонных пластинках. Тяжелых, хрупких, спрятанных в плотные бумажные конверты. Это единственный товар ярмарки, который он купил, а не спер.</p>

    <p>Джоплин, как и любой рэгтайм, звучит для него как дуэль. Пока чья-то палочка плавно взмывает вверх, Оуэн уже ломает ритм. Он вскидывает руку так быстро, что его заклинание добавляет акцент хаоса в заученные движения.</p>

    <p>Фокстрот похож на его дом. Летом, пока старшие братья улепетывают вниз по лестницам по своим важным делам, Оуэн смакует бодрое одиночество. Состояние, когда остаешься дома один и в твоем распоряжении, кажется, целый мир. А значит, и мамина метла. Жаль только, что нельзя взять с собой граммофон. С ним пролетать над рекой, едва касаясь носками воды, было бы куда веселее.</p>

    <p>Стравинским он искренне восхищается. Особенно “Адской пляской Кащея”. Но воспоминания — штука такая: сложные ритмы, резкие акценты и диссонансы впечатались в его память тремя парами глаз.</p>

    <p>Он притаскивает в артельский подвал один из старых переносных граммофонов. Целый чемодан под него выделил. Граммофон — предмет тяжелый, однако крайне ранимый, поэтому почти всю поездку до Хогвартса Оуэн сидит с ним под боком, как курица-наседка.</p>

    <p>Три пары глаз — он переводит взгляд с одних на другие — выражают неловкость, раздражение и тихую надежду, что когда-нибудь этот музыкальный поток закончится.</p>

    <p>Сильнее всех брови хмурит Мэгги: “У меня голова сейчас лопнет”.</p>

    <p>Беа осмысливает услышанное со стороны мастерства автора: “Это определенно сложная композиция”.</p>

    <p>Элиас молчит, вероятно, чтобы его не обидеть. Наверное. Элиас почти всегда молчит.</p>

    <p>Реакция была ожидаемой, хотя небольшую обиду Оуэн все-таки затаил. Все в нем было громким и нарочито нахальным. Кроме тонкого слуха и любви к музыке. Это давало ему ценную и, признаться, приятную возможность смотреть на всех немного свысока. Даже если обозреваемые об этом не знали.</p>

    <p>Зато Оуэн знал.</p>

    <p>У любого воспоминания найдется мелодия. Рассвет — как едва слышный перебор гитарных струн. Тревога — как одинокая клавиша пианино, послушная неумолимому метроному. Дом — как фокстрот, который продолжается, даже когда танцевать уже некому.</p>

    <p>В следующем учебном году он притаскивает новую пластинку — Kitten on the Keys. С уверенностью ставит друзей перед фактом:</p>

    <p>“Это мы”.</p>

   8: `
    <h2>О зверях и не зверях</h2>

    <p>К концу августа их забор по-прежнему стоит криво. Впрочем, теперь хотя бы в другую сторону.</p>

    };

    const PAGE_WIDTH = 432;

    const BOOK_WIDTH = PAGE_WIDTH * 2;

    const BOOK_HEIGHT = 612;

    const DURATION_MS = 720;

    const LAST_SPREAD = 3;

    const openBookButton = document.getElementById("openBook");

    const closeBookButton = document.getElementById("closeBook");

    const opened = document.getElementById("opened");

    const backdrop = document.getElementById("backdrop");

    const canvas = document.getElementById("canvas");

    const book = document.getElementById("book");

    const leftPaper = document.getElementById("leftPaper");

    const rightPaper = document.getElementById("rightPaper");

    const prevButton = document.getElementById("prev");

    const nextButton = document.getElementById("next");

    const status = document.getElementById("status");

    let position = -1; // -1 = передняя обложка, 0..3 = развороты, 4 = задняя обложка

    let busy = false;

    let scale = 1;

    let animationTimer = null;

    let touchStart = null;

    function escapeHtml(value) {

      return String(value).replace(/[&<>"']/g, ch => ({

        "&": "&amp;", "<": "&lt;", ">": "&gt;",

        '"': "&quot;", "'": "&#39;"

      }[ch]));

    }

    function getImage(ref) {

      if (ref === "cover") return ASSETS.cover;

      if (ref === "back") return ASSETS.back;

      if (typeof ref === "number") return ASSETS.pages[ref - 1] || "";

      return "";

    }

    function faceHtml(ref) {
      if (typeof ref === "number" && Object.prototype.hasOwnProperty.call(TEXT_PAGES, ref)) {
        const side = ref % 2 === 0 ? "right" : "left";
        return `<div class="face-body"><article class="text-page ${side}"><div class="text-page-inner">${TEXT_PAGES[ref]}</div></article></div>`;
      }

      const imageUrl = getImage(ref);
      const alt = ref === "cover"
        ? "Передняя обложка"
        : ref === "back"
          ? "Задняя обложка"
          : ref === "empty"
            ? ""
            : `Страница ${ref}`;

      if (ref === "empty") {
        return `<div class="face-body"></div>`;
      }

      const coverClass = (ref === "cover" || ref === "back") ? " mirrored-cover" : "";
      return `<div class="face-body"><img class="image-page${coverClass}" src="${escapeHtml(imageUrl)}" draggable="false" alt="${escapeHtml(alt)}"></div>`;
    }

    function isCutout(ref) {
      return ref === "cover" || ref === "back" || ref === "empty";
    }

    function setPaper(element, ref) {
      element.classList.toggle("is-cutout", isCutout(ref));
      element.innerHTML = faceHtml(ref);
    }

    function setPositionShift(pos) {

      const shift = pos === -1 ? -PAGE_WIDTH / 2 : pos === 4 ? PAGE_WIDTH / 2 : 0;

      book.style.setProperty("--shift", shift + "px");

    }

    function renderStatic(pos) {

      book.classList.toggle("front-closed", pos === -1);

      book.classList.toggle("back-closed", pos === 4);

      if (pos === -1) {

        setPaper(leftPaper, "empty");

        setPaper(rightPaper, "cover");

      } else if (pos === 4) {

        setPaper(leftPaper, "back");

        setPaper(rightPaper, "empty");

      } else {

        setPaper(leftPaper, 2 * pos + 1);

        setPaper(rightPaper, 2 * pos + 2);

      }

      setPositionShift(pos);

      status.textContent = pos === -1

        ? "Передняя обложка"

        : pos === 4

          ? "Задняя обложка"

          : `Разворот ${pos + 1} / 4`;

      prevButton.disabled = busy || pos === -1;

      nextButton.disabled = busy || pos === 4;

    }

    function fitBook() {

      scale = Math.min(

        (canvas.clientWidth - 24) / BOOK_WIDTH,

        (canvas.clientHeight - 18) / BOOK_HEIGHT,

        document.fullscreenElement === opened ? 3 : 1.45

      );

      book.style.setProperty("--scale", Math.max(.08, scale).toFixed(5));

    }

    function createLeaf(direction, front, back) {

      const leaf = document.createElement("div");

      leaf.className = `leaf ${direction}`;

      leaf.innerHTML = `

        <div class="leaf-face front${isCutout(front) ? " is-cutout" : ""}">${faceHtml(front)}</div>
        <div class="leaf-face back${isCutout(back) ? " is-cutout" : ""}">${faceHtml(back)}</div>`;

      return leaf;

    }

    function go(delta) {

      if (busy) return;

      const target = position + delta;

      if (target < -1 || target > 4) return;

      busy = true;

      const from = position;

      prevButton.disabled = true;

      nextButton.disabled = true;

      book.classList.remove("front-closed", "back-closed");

      let leaf;

      if (delta === 1) {

        if (from === -1) {

          setPaper(leftPaper, "empty");

          setPaper(rightPaper, 2);

          leaf = createLeaf("forward", "cover", 1);

        } else if (from === LAST_SPREAD) {

          setPaper(leftPaper, 7);

          setPaper(rightPaper, "empty");

          leaf = createLeaf("forward", 8, "back");

        } else {

          setPaper(leftPaper, 2 * from + 1);

          setPaper(rightPaper, 2 * target + 2);

          leaf = createLeaf("forward", 2 * from + 2, 2 * target + 1);

        }

      } else {

        if (from === 4) {

          setPaper(leftPaper, 7);

          setPaper(rightPaper, "empty");

          leaf = createLeaf("backward", "back", 8);

        } else if (from === 0) {

          setPaper(leftPaper, "empty");

          setPaper(rightPaper, 2);

          leaf = createLeaf("backward", 1, "cover");

        } else {

          setPaper(leftPaper, 2 * target + 1);

          setPaper(rightPaper, 2 * from + 2);

          leaf = createLeaf("backward", 2 * from + 1, 2 * target + 2);

        }

      }

      book.appendChild(leaf);

      requestAnimationFrame(() => requestAnimationFrame(() => {

        setPositionShift(target);

        leaf.classList.add("turned");

      }));

      clearTimeout(animationTimer);

      animationTimer = setTimeout(() => {

        position = target;

        leaf.remove();

        busy = false;

        renderStatic(position);

      }, DURATION_MS + 70);

    }

    let wasReallyFullscreen = false;

    // Called directly from the cover's click handler: the browser requires a user gesture.
    function openViewer() {
      if (opened.classList.contains("active")) return;

      opened.classList.add("active");
      opened.setAttribute("aria-hidden", "false");
      position = -1;
      renderStatic(position);

      const beginReading = () => {
        if (!opened.classList.contains("active")) return;
        fitBook();
        // Open the front cover automatically: no second click needed.
        go(1);
        closeBookButton.focus({ preventScroll: true });
      };

      // IMPORTANT: requestFullscreen must happen synchronously during the click.
      if (typeof opened.requestFullscreen === "function") {
        try {
          const request = opened.requestFullscreen({ navigationUI: "hide" });
          Promise.resolve(request)
            .then(beginReading)
            .catch(err => {
              console.info("Fullscreen is not allowed by this embedding environment:", err);
              opened.classList.remove("fullscreen-mode");
              beginReading(); // fallback: book still opens in the available iframe
            });
        } catch (err) {
          console.info("Fullscreen is not available:", err);
          beginReading();
        }
      } else {
        beginReading();
      }
    }

    function closeViewer() {
      if (document.fullscreenElement === opened) {
        document.exitFullscreen().catch(() => {});
      }

      opened.classList.remove("active", "fullscreen-mode");
      opened.setAttribute("aria-hidden", "true");
      wasReallyFullscreen = false;
      busy = false;
      clearTimeout(animationTimer);
      position = -1;
      Array.from(book.querySelectorAll('.leaf')).forEach(node => node.remove());
      renderStatic(position);
      openBookButton.focus({ preventScroll: true });
    }

    document.addEventListener("fullscreenchange", () => {
      const fullscreen = document.fullscreenElement === opened;
      opened.classList.toggle("fullscreen-mode", fullscreen);
      if (fullscreen) {
        wasReallyFullscreen = true;
        fitBook();
      } else if (wasReallyFullscreen && opened.classList.contains("active")) {
        // The browser's Escape key also exits fullscreen. Close the book as well.
        closeViewer();
      } else {
        wasReallyFullscreen = false;
      }
    });

    openBookButton.addEventListener("click", openViewer);

    closeBookButton.addEventListener("click", closeViewer);

    backdrop.addEventListener("click", closeViewer);

    prevButton.addEventListener("click", () => go(-1));

    nextButton.addEventListener("click", () => go(1));

    book.addEventListener("click", event => {

      if (busy) return;

      if (event.target.closest('.text-page')) return;

      if (position === -1) { go(1); return; }

      if (position === 4) { go(-1); return; }

      const rect = book.getBoundingClientRect();

      go(event.clientX < rect.left + rect.width / 2 ? -1 : 1);

    });

    document.addEventListener("keydown", event => {

      const isOpen = opened.classList.contains("active");

      if (!isOpen) return;

      if (event.key === "Escape") {

        event.preventDefault();

        closeViewer();

      }

      if (event.key === "ArrowRight") {

        event.preventDefault();

        go(1);

      }

      if (event.key === "ArrowLeft") {

        event.preventDefault();

        go(-1);

      }

    });

    canvas.addEventListener("touchstart", e => {

      if (e.touches.length === 1) {

        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };

      }

    }, { passive: true });

    canvas.addEventListener("touchend", e => {

      if (!touchStart || !e.changedTouches.length) return;

      const dx = e.changedTouches[0].clientX - touchStart.x;

      const dy = e.changedTouches[0].clientY - touchStart.y;

      touchStart = null;

      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {

        e.preventDefault();

        go(dx < 0 ? 1 : -1);

      }

    }, { passive: false });

    window.addEventListener("resize", fitBook);

    if ("ResizeObserver" in window) {

      new ResizeObserver(fitBook).observe(canvas);

    }

    fitBook();

    renderStatic(position);

  </script>
