<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Книжечка Мэгги</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: transparent;
      color: #ede4d6;
      overflow: hidden;
    }

    button { font: inherit; }

    .library {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
    }

    /* Полка / закрытая книга */
    .shelf-stage {
      position: relative;
      width: min(241px, 90vw);
      aspect-ratio: 241 / 429;
      background: url('./shelf.png') center / contain no-repeat;
      user-select: none;
      -webkit-user-select: none;
      isolation: isolate;
    }

    .book-trigger {
      position: absolute;
      left: 44%;
      top: 46%;
      width: 32%;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transform: rotate(-8deg);
      transition: transform .28s ease, filter .28s ease;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.35));
    }

    .book-trigger:hover,
    .book-trigger:focus-visible {
      transform: rotate(-10deg) translateY(-4px) scale(1.03);
      filter: drop-shadow(0 15px 18px rgba(0,0,0,.42));
      outline: none;
    }

    .book-trigger img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .tap-hint {
      position: absolute;
      left: 50%;
      bottom: -42px;
      transform: translateX(-50%);
      font-size: 13px;
      line-height: 1.35;
      letter-spacing: .02em;
      color: rgba(255,255,255,.8);
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.45);
    }

    /* Оверлей с открытой книгой */
    .opened {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 20;
    }

    .opened.active {
      display: block;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 16, .78);
      backdrop-filter: blur(4px);
    }

    .viewer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px 78px;
    }

    .close-button {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 25;
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(24, 27, 34, .8);
      color: #f5eee2;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
    }

    .close-button:hover,
    .close-button:focus-visible {
      background: rgba(42, 46, 58, .92);
      outline: none;
    }

    .book-wrap {
      position: relative;
      width: min(100%, 1200px);
      height: min(100%, 850px);
    }

    .hint {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, calc(100% - 20px));
      text-align: center;
      font-size: 12px;
      letter-spacing: .02em;
      color: rgba(255,255,255,.68);
      pointer-events: none;
      z-index: 4;
    }

    .canvas {
      position: absolute;
      inset: 20px 0 66px;
      overflow: hidden;
    }

    .book {
      --scale: 1;
      --shift: -216px;
      position: absolute;
      width: 864px;
      height: 612px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--scale)) translateX(var(--shift));
      transition: transform 720ms cubic-bezier(.22,.67,.2,1);
      perspective: 2200px;
      transform-style: preserve-3d;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .paper {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      overflow: hidden;
      box-shadow: 0 10px 26px rgba(0,0,0,.22), 0 2px 5px rgba(0,0,0,.12);
      background: #f0eee8;
    }

    .paper.left { left: 0; border-radius: 4px 0 0 4px; }
    .paper.right { right: 0; border-radius: 0 4px 4px 0; }
    .book.front-closed .paper.left,
    .book.back-closed .paper.right { visibility: hidden; }

    .spine {
      z-index: 4;
      position: absolute;
      left: calc(50% - 13px);
      top: 0;
      width: 26px;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(90deg,
        rgba(255,255,255,.1) 0%,
        rgba(0,0,0,.08) 20%,
        rgba(0,0,0,.25) 48%,
        rgba(255,255,255,.18) 54%,
        rgba(0,0,0,.08) 100%);
      opacity: .92;
      transition: opacity .15s;
    }

    .book.front-closed .spine,
    .book.back-closed .spine { opacity: 0; }

    .leaf {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      z-index: 15;
      pointer-events: none;
      transition: transform 720ms cubic-bezier(.34,.12,.28,1);
    }

    .leaf.forward { left: 50%; transform-origin: left center; transform: rotateY(0deg); }
    .leaf.forward.turned { transform: rotateY(-180deg); }
    .leaf.backward { left: 0; transform-origin: right center; transform: rotateY(0deg); }
    .leaf.backward.turned { transform: rotateY(180deg); }

    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      background: #f0eee8;
      box-shadow: 0 6px 18px rgba(0,0,0,.19);
    }

    .leaf-face.back { transform: rotateY(180deg); }
    .leaf-face::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.02) 100%);
    }
    .leaf.forward .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 28%, rgba(0,0,0,.08)); }
    .leaf.forward .leaf-face.back::after { background: linear-gradient(90deg, rgba(0,0,0,.08), transparent 30%); }
    .leaf.backward .leaf-face.front::after { background: linear-gradient(90deg, rgba(0,0,0,.05), transparent 35%, rgba(0,0,0,.06)); }
    .leaf.backward .leaf-face.back::after { background: linear-gradient(90deg, rgba(0,0,0,.09), transparent 35%); }

    .face-body {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ece9e0;
    }

    .image-page {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      -webkit-user-drag: none;
    }

    .toolbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: min(680px, calc(100% - 16px));
      min-height: 46px;
      padding: 6px 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(24, 27, 34, .82);
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
    }

    .toolbar button {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: #f6efe4;
      padding: 9px 12px;
      min-width: 104px;
      cursor: pointer;
      font-size: 13px;
    }

    .toolbar button:hover:not(:disabled),
    .toolbar button:focus-visible:not(:disabled) {
      background: rgba(255,255,255,.14);
      outline: none;
    }

    .toolbar button:disabled {
      cursor: default;
      opacity: .35;
    }

    .status {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      color: rgba(255,255,255,.9);
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .viewer { padding-inline: 10px; }
      .hint { display: none; }
    }

    @media (max-width: 560px) {
      .toolbar { gap: 6px; }
      .toolbar button { min-width: 0; font-size: 12px; padding: 8px 10px; }
      .status { font-size: 12px; }
      .tap-hint { bottom: -50px; white-space: normal; width: 180px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .book, .leaf, .book-trigger, .opened { transition-duration: 0.1ms !important; }
    }
  </style>
</head>
<body>
  <main class="library" id="library">
    <div class="shelf-stage" aria-label="Полка с книжечкой Мэгги">
      <button class="book-trigger" id="openBook" type="button" aria-label="Открыть книжечку Мэгги">
        <img src="./book-closed.png" alt="Книжечка Мэгги" draggable="false">
      </button>
      <div class="tap-hint">Нажми на книжечку ✦</div>
    </div>

    <section class="opened" id="opened" aria-hidden="true">
      <div class="backdrop" id="backdrop"></div>
      <button class="close-button" id="closeBook" type="button" aria-label="Закрыть книгу">Закрыть ✕</button>
      <div class="viewer">
        <div class="book-wrap">
          <div class="hint">Нажми на правую страницу, чтобы листать вперёд, на левую — назад</div>
          <div class="canvas" id="canvas">
            <div class="book front-closed" id="book" role="group" aria-label="Интерактивная книжечка Мэгги">
              <div class="paper left" id="leftPaper"></div>
              <div class="paper right" id="rightPaper"></div>
              <div class="spine"></div>
            </div>
          </div>
          <nav class="toolbar" aria-label="Навигация по книге">
            <button id="prev" type="button">← Назад</button>
            <span class="status" id="status" aria-live="polite">Передняя обложка</span>
            <button id="next" type="button">Вперёд →</button>
          </nav>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const ASSETS = {
      cover: "./cover.png",
      back: "./back.png",
      pages: [
        "./page-01.png",
        "./page-02.png",
        "./page-03.png",
        "./page-04.png",
        "./page-05.png",
        "./page-06.png",
        "./page-07.png",
        "./page-08.png"
      ]
    };

    const PAGE_WIDTH = 432;
    const BOOK_WIDTH = PAGE_WIDTH * 2;
    const BOOK_HEIGHT = 612;
    const DURATION_MS = 720;
    const LAST_SPREAD = 3;

    const openBookButton = document.getElementById("openBook");
    const closeBookButton = document.getElementById("closeBook");
    const opened = document.getElementById("opened");
    const backdrop = document.getElementById("backdrop");
    const canvas = document.getElementById("canvas");
    const book = document.getElementById("book");
    const leftPaper = document.getElementById("leftPaper");
    const rightPaper = document.getElementById("rightPaper");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");
    const status = document.getElementById("status");

    let position = -1; // -1 = передняя обложка, 0..3 = развороты, 4 = задняя обложка
    let busy = false;
    let scale = 1;
    let animationTimer = null;
    let touchStart = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
    }

    function getImage(ref) {
      if (ref === "cover") return ASSETS.cover;
      if (ref === "back") return ASSETS.back;
      if (typeof ref === "number") return ASSETS.pages[ref - 1] || "";
      return "";
    }

    function faceHtml(ref) {
      const imageUrl = getImage(ref);
      const alt = ref === "cover"
        ? "Передняя обложка"
        : ref === "back"
          ? "Задняя обложка"
          : ref === "empty"
            ? ""
            : `Страница ${ref}`;

      if (ref === "empty") {
        return `<div class="face-body"></div>`;
      }

      return `<div class="face-body"><img class="image-page" src="${escapeHtml(imageUrl)}" draggable="false" alt="${escapeHtml(alt)}"></div>`;
    }

    function setPositionShift(pos) {
      const shift = pos === -1 ? -PAGE_WIDTH / 2 : pos === 4 ? PAGE_WIDTH / 2 : 0;
      book.style.setProperty("--shift", shift + "px");
    }

    function renderStatic(pos) {
      book.classList.toggle("front-closed", pos === -1);
      book.classList.toggle("back-closed", pos === 4);

      if (pos === -1) {
        leftPaper.innerHTML = faceHtml("empty");
        rightPaper.innerHTML = faceHtml("cover");
      } else if (pos === 4) {
        leftPaper.innerHTML = faceHtml("back");
        rightPaper.innerHTML = faceHtml("empty");
      } else {
        leftPaper.innerHTML = faceHtml(2 * pos + 1);
        rightPaper.innerHTML = faceHtml(2 * pos + 2);
      }

      setPositionShift(pos);
      status.textContent = pos === -1
        ? "Передняя обложка"
        : pos === 4
          ? "Задняя обложка"
          : `Разворот ${pos + 1} / 4`;

      prevButton.disabled = busy || pos === -1;
      nextButton.disabled = busy || pos === 4;
    }

    function fitBook() {
      scale = Math.min(
        (canvas.clientWidth - 24) / BOOK_WIDTH,
        (canvas.clientHeight - 18) / BOOK_HEIGHT,
        1.45
      );
      book.style.setProperty("--scale", Math.max(.08, scale).toFixed(5));
    }

    function createLeaf(direction, front, back) {
      const leaf = document.createElement("div");
      leaf.className = `leaf ${direction}`;
      leaf.innerHTML = `
        <div class="leaf-face front">${faceHtml(front)}</div>
        <div class="leaf-face back">${faceHtml(back)}</div>`;
      return leaf;
    }

    function go(delta) {
      if (busy) return;
      const target = position + delta;
      if (target < -1 || target > 4) return;

      busy = true;
      const from = position;
      prevButton.disabled = true;
      nextButton.disabled = true;
      book.classList.remove("front-closed", "back-closed");

      let leaf;
      if (delta === 1) {
        if (from === -1) {
          leftPaper.innerHTML = faceHtml("empty");
          rightPaper.innerHTML = faceHtml(2);
          leaf = createLeaf("forward", "cover", 1);
        } else if (from === LAST_SPREAD) {
          leftPaper.innerHTML = faceHtml(7);
          rightPaper.innerHTML = faceHtml("empty");
          leaf = createLeaf("forward", 8, "back");
        } else {
          leftPaper.innerHTML = faceHtml(2 * from + 1);
          rightPaper.innerHTML = faceHtml(2 * target + 2);
          leaf = createLeaf("forward", 2 * from + 2, 2 * target + 1);
        }
      } else {
        if (from === 4) {
          leftPaper.innerHTML = faceHtml(7);
          rightPaper.innerHTML = faceHtml("empty");
          leaf = createLeaf("backward", "back", 8);
        } else if (from === 0) {
          leftPaper.innerHTML = faceHtml("empty");
          rightPaper.innerHTML = faceHtml(2);
          leaf = createLeaf("backward", 1, "cover");
        } else {
          leftPaper.innerHTML = faceHtml(2 * target + 1);
          rightPaper.innerHTML = faceHtml(2 * from + 2);
          leaf = createLeaf("backward", 2 * from + 1, 2 * target + 2);
        }
      }

      book.appendChild(leaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setPositionShift(target);
        leaf.classList.add("turned");
      }));

      clearTimeout(animationTimer);
      animationTimer = setTimeout(() => {
        position = target;
        leaf.remove();
        busy = false;
        renderStatic(position);
      }, DURATION_MS + 70);
    }

    function openViewer() {
      opened.classList.add("active");
      opened.setAttribute("aria-hidden", "false");
      fitBook();
      renderStatic(position);
      setTimeout(() => closeBookButton.focus(), 30);
    }

    function closeViewer() {
      opened.classList.remove("active");
      opened.setAttribute("aria-hidden", "true");
      busy = false;
      clearTimeout(animationTimer);
      position = -1;
      Array.from(book.querySelectorAll('.leaf')).forEach(node => node.remove());
      renderStatic(position);
      openBookButton.focus();
    }

    openBookButton.addEventListener("click", openViewer);
    closeBookButton.addEventListener("click", closeViewer);
    backdrop.addEventListener("click", closeViewer);
    prevButton.addEventListener("click", () => go(-1));
    nextButton.addEventListener("click", () => go(1));

    book.addEventListener("click", event => {
      if (busy) return;
      if (position === -1) { go(1); return; }
      if (position === 4) { go(-1); return; }
      const rect = book.getBoundingClientRect();
      go(event.clientX < rect.left + rect.width / 2 ? -1 : 1);
    });

    document.addEventListener("keydown", event => {
      const isOpen = opened.classList.contains("active");
      if (!isOpen) return;
      if (event.key === "Escape") {
        event.preventDefault();
        closeViewer();
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        go(1);
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        go(-1);
      }
    });

    canvas.addEventListener("touchstart", e => {
      if (e.touches.length === 1) {
        touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    }, { passive: true });

    canvas.addEventListener("touchend", e => {
      if (!touchStart || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        e.preventDefault();
        go(dx < 0 ? 1 : -1);
      }
    }, { passive: false });

    window.addEventListener("resize", fitBook);
    if ("ResizeObserver" in window) {
      new ResizeObserver(fitBook).observe(canvas);
    }

    fitBook();
    renderStatic(position);
  </script>
</body>
</html>
